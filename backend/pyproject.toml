[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.26",
    "asyncpg>=0.30.0",
    "bcrypt>=4.1,<6",
    "fastapi>=0.165.0",
    "orjson>=3.13.0",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "PyJWT>=2.10",
    "python-multipart>=0.0.34",
    "redis>=5.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Production file storage (STORAGE_BACKEND=s3). Local disk needs no extras.
s3 = ["aioboto3>=13.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
