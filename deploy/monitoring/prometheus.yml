# Example Prometheus scrape config for the pilot.
#
# Backend and frontend are not published on the host, so run Prometheus in the
# same compose network or scrape through an internal ingress.
#
#   docker run --rm --network deploy_default \
#     -v "$PWD/deploy/monitoring:/etc/prometheus" -p 9090:9090 prom/prometheus
#
# Blackbox probe for HTTPS readiness (optional):
#   blackbox_exporter with module http_2xx, target https://project.school.example/api/backend/readyz

global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: my-school-project-backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["backend:8000"]
