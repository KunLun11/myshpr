# Production stack: Caddy (TLS) -> Next.js -> FastAPI, plus Postgres, Redis
# and the ARQ worker. Only Caddy publishes ports; everything else stays on the
# private compose network.
#
#   cp deploy/.env.example deploy/.env && $EDITOR deploy/.env
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#   docker compose -f deploy/docker-compose.prod.yml exec backend \
#     /app/.venv/bin/python -m app.db.seed --dev   # demo only, never in prod data
#
# Migrations run in the one-shot `migrate` service before backend/worker start.
#
# All runtime settings come from `deploy/.env` (see docs/env.md). The optional
# `backend/.env` is only a fallback for extra overrides; it is NOT required on a
# server. Requires Docker Compose >= 2.24 (`env_file: required: false`).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  ENV: prod
  DEBUG: "false"
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL in deploy/.env}
  BACKEND_URL: http://backend:8000
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
  ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in deploy/.env}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in deploy/.env}
  RATE_LIMIT_BACKEND: redis
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  HSTS_ENABLED: ${HSTS_ENABLED:-true}
  # Topic check thresholds
  TOPIC_DUPLICATE_WARN: ${TOPIC_DUPLICATE_WARN:-0.55}
  TOPIC_DUPLICATE_BLOCK: ${TOPIC_DUPLICATE_BLOCK:-0.85}
  TOPIC_BROADNESS_OK: ${TOPIC_BROADNESS_OK:-70}
  TOPIC_BROADNESS_WARN: ${TOPIC_BROADNESS_WARN:-40}
  # Dashboard / reminder thresholds
  INACTIVITY_YELLOW_DAYS: ${INACTIVITY_YELLOW_DAYS:-7}
  INACTIVITY_RED_DAYS: ${INACTIVITY_RED_DAYS:-14}
  CHECKPOINT_SOON_DAYS: ${CHECKPOINT_SOON_DAYS:-7}
  CHECKLIST_SOON_DAYS: ${CHECKLIST_SOON_DAYS:-3}
  CHECKLIST_STALLED_DAYS: ${CHECKLIST_STALLED_DAYS:-14}
  FINAL_FILE_DAYS_BEFORE: ${FINAL_FILE_DAYS_BEFORE:-14}
  REVIEW_WAIT_DAYS: ${REVIEW_WAIT_DAYS:-5}
  # File storage
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  # Fixed: the `media_data` volume is mounted at /app/media.
  MEDIA_ROOT: media
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
  MAX_FILES_PER_PROJECT: ${MAX_FILES_PER_PROJECT:-10}
  ALLOWED_UPLOAD_MIME: ${ALLOWED_UPLOAD_MIME:-application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,image/png,image/jpeg,application/zip}
  ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-.pdf,.docx,.pptx,.png,.jpg,.jpeg,.zip}
  # S3 (only when STORAGE_BACKEND=s3)
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_REGION: ${S3_REGION:-}
  # Email (reserved: not sent by the app yet)
  EMAIL_FROM: ${EMAIL_FROM:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: prod
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    # Optional: every setting used in prod is already in x-backend-env above.
    env_file:
      - path: ../backend/.env
        required: false
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: prod
    expose:
      - "8000"
    # Optional: every setting used in prod is already in x-backend-env above.
    env_file:
      - path: ../backend/.env
        required: false
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: prod
    command: ["/app/.venv/bin/arq", "app.workers.settings.WorkerSettings"]
    # Optional: every setting used in prod is already in x-backend-env above.
    env_file:
      - path: ../backend/.env
        required: false
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
      args:
        BACKEND_URL: http://backend:8000
    expose:
      - "3000"
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      # Docker already sets HOSTNAME to the container id; the Next standalone
      # server would bind to that address and the localhost healthcheck fails.
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myschoolproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-myschoolproject}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myschoolproject}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

volumes:
  pg_data:
  redis_data:
  media_data:
  caddy_data:
  caddy_config:


