services:
  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      - db
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv
  
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules  
  
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myschoolproject
      POSTGRES_PASSWORD: myschoolproject
      POSTGRES_DB: myschoolproject
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
  backend_venv:
  frontend_node_modules: