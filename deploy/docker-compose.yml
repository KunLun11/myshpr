services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    command: ["uv", "run", "arq", "app.workers.settings.WorkerSettings"]
    env_file:
      - ../backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - backend_venv:/app/.venv

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myschoolproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myschoolproject}
      POSTGRES_DB: ${POSTGRES_DB:-myschoolproject}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myschoolproject}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  backend_venv:
  frontend_node_modules:
